services:
  relay-panel-db:
    image: mariadb:11
    container_name: relay-panel-db
    restart: always
    environment:
      - MARIADB_DATABASE=relaypanel
      - MARIADB_USER=relay
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - TZ=Europe/Tallinn
    volumes:
      - relay-panel-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  relay-panel-web:
    # ALWAYS build from this checkout. pull_policy: build stops a bare
    # `docker compose up -d` (or a stray `pull`) from replacing the running app
    # with a prebuilt registry image and silently reverting local work.
    image: ghcr.io/gren-95/ha-relay-panel:latest
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    pull_policy: build
    container_name: relay-panel-web
    restart: always
    ports:
      - "8090:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=relay-panel-db
      - DB_USER=relay
      - DB_NAME=relaypanel
      - TZ=Europe/Tallinn
    depends_on:
      relay-panel-db:
        condition: service_healthy

volumes:
  relay-panel-data:
