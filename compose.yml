services:
  relay-panel-web:
    # ALWAYS build from this checkout. pull_policy: build stops a bare
    # `docker compose up -d` (or a stray `pull`) from replacing the running app
    # with a prebuilt registry image and silently reverting local work.
    image: ghcr.io/gren-95/ha-relay-panel:latest
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    pull_policy: build
    container_name: relay-panel-web
    restart: always
    ports:
      - "${HTTP_PORT:-8090}:3000"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      # The panel's storage (embedded SQLite): one file, survives down/recreate
      # and an image upgrade. Escape hatch: set DB_HOST (+ DB_USER/DB_PASSWORD/
      # DB_NAME) in .env and the app uses that external MariaDB instead, and
      # this volume stays empty.
      - relay-panel-appdata:/app/data

volumes:
  relay-panel-appdata:
