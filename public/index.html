<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay Panel</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>try{var t=localStorage.getItem('relaypanel-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ha-banner" class="ha-banner hidden"><i class="bi bi-exclamation-triangle-fill"></i> <span data-i18n="ha_unreachable">Home Assistant unreachable — readings may be stale</span></div>
  <header>
    <h1><i class="bi bi-lightning-charge-fill"></i> <span data-i18n="app_title">Relay Panel</span> <span id="summary" class="summary"></span></h1>
    <button id="btn-menu" class="btn menu-btn" aria-label="Menu"><i class="bi bi-list"></i></button>
    <div id="toolbar" class="toolbar">
      <span id="status" class="status"></span>
      <div class="tb-group edit-only">
        <select id="device-picker" class="btn select"><option value="" data-i18n="physical_relay_ph">+ Physical relay…</option></select>
        <select id="area-picker" class="btn select"><option value="" data-i18n="area_ph">+ Area…</option></select>
      </div>
      <span class="tb-divider edit-only"></span>
      <div class="tb-group">
        <button id="btn-save" class="btn edit-only"><i class="bi bi-floppy"></i> <span data-i18n="save">Save</span></button>
        <button id="btn-alloff" class="btn" data-i18n-title="all_off_title" title="Turn all relays off"><i class="bi bi-power"></i></button>
        <button id="btn-mode" class="btn"><i class="bi bi-pencil-square"></i> <span id="mode-label">Edit</span></button>
        <button id="btn-logout" class="btn hidden" data-i18n-title="sign_out" title="Sign out"><i class="bi bi-box-arrow-right"></i></button>
        <button id="btn-lang" class="btn" title="Keel / Language">ET</button>
        <button id="btn-theme" class="btn" data-i18n-title="toggle_dark" title="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
      </div>
      <span class="tb-divider"></span>
      <div class="tb-group tb-advanced">
        <button id="btn-advanced" class="btn"><i class="bi bi-gear"></i> <span data-i18n="advanced">Advanced</span> <i class="bi bi-caret-down-fill"></i></button>
        <div id="advanced-menu" class="tb-menu hidden">
          <button id="btn-add" class="btn menu-item edit-only"><i class="bi bi-plus-lg"></i> <span data-i18n="add_single_relay">Add single relay</span></button>
          <span class="tb-menu-sep edit-only"></span>
          <button id="btn-export" class="btn menu-item"><i class="bi bi-download"></i> <span data-i18n="export_layout">Export layout</span></button>
          <button id="btn-import" class="btn menu-item"><i class="bi bi-upload"></i> <span data-i18n="import_layout">Import layout</span></button>
          <span class="tb-menu-sep"></span>
          <button id="btn-activity" class="btn menu-item"><i class="bi bi-clock-history"></i> <span data-i18n="activity_log">Activity log</span></button>
          <span class="tb-menu-sep"></span>
          <button id="btn-bulk" class="btn menu-item"><i class="bi bi-collection"></i> <span data-i18n="bulk_edit">Bulk edit</span></button>
          <span class="tb-menu-sep"></span>
          <button id="btn-presets" class="btn menu-item"><i class="bi bi-bookmark"></i> <span data-i18n="presets">Presets</span></button>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </div>
    </div>
  </header>

  <main id="canvas" class="canvas edit"></main>

  <!-- Editor panel -->
  <aside id="editor" class="editor hidden">
    <div class="editor-head">
      <h2 data-i18n="edit_relay">Edit relay</h2>
      <button id="ed-close" class="x">&times;</button>
    </div>
    <label><span data-i18n="name">Name</span>
      <input id="ed-name" type="text" data-i18n-ph="name_ph" placeholder="e.g. Masterwood heater" />
    </label>
    <label><span data-i18n="relay_to_switch">Relay to switch</span>
      <select id="ed-relay"></select>
    </label>
    <button id="ed-rename-relay" class="btn tiny" type="button"><i class="bi bi-pencil"></i> <span data-i18n="rename_this_relay">Rename this relay</span></button>
    <label><span data-i18n="temp_sensor">Temperature sensor</span>
      <select id="ed-sensor"></select>
    </label>
    <button id="ed-rename-sensor" class="btn tiny" type="button"><i class="bi bi-pencil"></i> <span data-i18n="rename_this_sensor">Rename this sensor</span></button>
    <label><span data-i18n="area">Area</span>
      <select id="ed-area"><option value="" data-i18n="none_opt">— none —</option></select>
    </label>
    <label><span data-i18n="heat_or_cool">Heat or cool?</span>
      <select id="ed-mode">
        <option value="below" data-i18n="heating_opt">Heating — switch ON when too cold</option>
        <option value="above" data-i18n="cooling_opt">Cooling — switch ON when too hot</option>
      </select>
    </label>
    <label><span data-i18n="target_temp">Target temperature (°C)</span>
      <input id="ed-temp" type="number" step="0.5" value="20" />
    </label>
    <label><span data-i18n="switchback_gap">Switch-back gap (°C) — optional, 0 = switch exactly at target</span>
      <input id="ed-deadband" type="number" step="0.5" min="0" value="0" />
    </label>
    <div class="ed-limits">
      <label><span data-i18n="min_on">Minimum on-time (min)</span>
        <input id="ed-minon" type="number" step="1" min="0" value="0" />
        <span class="ed-hint" data-i18n="min_on_hint">Prevent short cycling: relay won't turn off before this time</span>
      </label>
      <label><span data-i18n="min_off">Minimum off-time (min)</span>
        <input id="ed-minoff" type="number" step="1" min="0" value="0" />
        <span class="ed-hint" data-i18n="min_off_hint">Prevent short cycling: relay won't turn on before this time</span>
      </label>
    </div>
    <div class="ed-notify">
      <label class="ed-sched-toggle"><input id="ed-notify" type="checkbox" /> <span data-i18n="notify_on_issues">Notify on issues</span></label>
      <label id="ed-notify-deviation-label" class="hidden" style="margin-top:6px"><span data-i18n="notify_deviation">Alert if temp deviates by (°C)</span>
        <input id="ed-notify-deviation" type="number" step="0.5" min="1" value="5" />
      </label>
    </div>
    <div class="ed-sched">
      <label class="ed-sched-toggle"><input id="ed-sched-on" type="checkbox" /> <span data-i18n="use_schedule">Use a schedule (different target by time)</span></label>
      <div id="ed-sched-body" class="hidden">
        <div id="ed-sched-blocks" class="ed-sched-blocks"></div>
        <button id="ed-sched-add" class="btn tiny" type="button"><i class="bi bi-plus-lg"></i> <span data-i18n="add_time_block">Add time block</span></button>
        <label class="ed-sched-fb"><span data-i18n="fallback_temp">Other times, target (°C)</span>
          <input id="ed-sched-fallback" type="number" step="0.5" />
        </label>
        <div class="ed-sched-hint" data-i18n="sched_hint">The main target above is used when no block matches (if no fallback set).</div>
      </div>
    </div>
    <div id="ed-stale" class="ed-stale hidden"></div>
    <div id="ed-history" class="ed-history hidden">
      <div class="ed-history-head">
        <span data-i18n="last_24h">History</span>
        <div class="ed-history-range">
          <button class="btn tiny range-btn active" data-range="24">24h</button>
          <button class="btn tiny range-btn" data-range="168">7d</button>
          <button class="btn tiny range-btn" data-range="720">30d</button>
        </div>
        <button id="ed-csv" class="btn tiny" data-i18n-title="download_csv" title="Download CSV"><i class="bi bi-download"></i> CSV</button>
      </div>
      <div style="position:relative">
        <svg id="ed-spark" class="spark" viewBox="0 0 440 220" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="ed-tooltip" class="chart-tooltip hidden"></div>
      </div>
      <div id="ed-history-info" class="ed-history-info"></div>
    </div>
    <div class="editor-actions">
      <button id="ed-bind" class="btn primary" data-i18n="save_turn_on_auto">Save &amp; turn on automatic control</button>
      <button id="ed-duplicate" class="btn" data-i18n="duplicate_relay">Duplicate</button>
      <button id="ed-unbind" class="btn" data-i18n="remove_automation">Remove automation</button>
      <button id="ed-delete" class="btn danger" data-i18n="delete_this_relay">Delete this relay</button>
    </div>
    <div id="ed-automation" class="ed-automation hidden">
      <div id="ed-automation-row" class="ed-automation-row hidden">
        <span id="ed-automation-status"></span>
        <button id="ed-automation-toggle" class="btn" type="button"></button>
      </div>
      <button id="ed-relay-toggle" class="btn" type="button"></button>
    </div>
    <p id="ed-msg" class="ed-msg"></p>
  </aside>

  <!-- Device (physical relay) editor panel -->
  <aside id="dev-editor" class="editor hidden">
    <div class="editor-head">
      <h2 data-i18n="physical_relay_h">Physical relay</h2>
      <button id="de-close" class="x">&times;</button>
    </div>
    <label><span data-i18n="label_shown">Label (shown on the box)</span>
      <input id="de-name" type="text" />
    </label>
    <button id="de-rename-ha" class="btn tiny" type="button"><i class="bi bi-pencil"></i> <span data-i18n="rename_device_ha">Rename device in Home Assistant</span></button>
    <label><span data-i18n="group_area">Group / area</span>
      <select id="de-area"><option value="" data-i18n="none_opt">— none —</option></select>
    </label>
    <div class="de-outputs-head" data-i18n="outputs">Outputs</div>
    <div id="de-outputs" class="de-outputs"></div>
    <select id="de-add-output" class="btn"><option value="" data-i18n="add_output_ph">+ Add output…</option></select>
    <div class="editor-actions">
      <button id="de-save" class="btn primary" data-i18n="save">Save</button>
      <button id="de-delete" class="btn danger" data-i18n="remove_from_board">Remove from board</button>
    </div>
    <p id="de-msg" class="ed-msg"></p>
  </aside>

  <!-- Activity log panel -->
  <aside id="activity-editor" class="editor hidden">
    <div class="editor-head">
      <h2><i class="bi bi-clock-history"></i> <span data-i18n="activity_log">Activity log</span></h2>
      <button id="act-close" class="x">&times;</button>
    </div>
    <div id="act-list" class="act-list"></div>
    <div id="act-pager" class="act-pager">
      <button id="act-prev" class="btn tiny hidden"><i class="bi bi-chevron-left"></i> <span data-i18n="newer">Newer</span></button>
      <span id="act-page-info"></span>
      <button id="act-next" class="btn tiny hidden"><i class="bi bi-chevron-right"></i> <span data-i18n="older">Older</span></button>
      <button id="act-csv" class="btn tiny" data-i18n-title="download_csv" title="Download CSV"><i class="bi bi-download"></i></button>
    </div>
    <p id="act-msg" class="ed-msg"></p>
  </aside>

  <!-- Bulk edit panel -->
  <aside id="bulk-editor" class="editor hidden">
    <div class="editor-head">
      <h2><i class="bi bi-collection"></i> <span data-i18n="bulk_edit">Bulk edit</span></h2>
      <button id="bk-close" class="x">&times;</button>
    </div>
    <label><span data-i18n="area">Area</span>
      <select id="bk-area"><option value="" data-i18n="all_relays">All relays</option></select>
    </label>
    <label><span data-i18n="heat_or_cool">Heat or cool?</span>
      <select id="bk-mode">
        <option value="below" data-i18n="heating_opt">Heating</option>
        <option value="above" data-i18n="cooling_opt">Cooling</option>
      </select>
    </label>
    <label><span data-i18n="target_temp">Target temperature (°C)</span>
      <input id="bk-temp" type="number" step="0.5" value="20" />
    </label>
    <label><span data-i18n="switchback_gap">Deadband (°C)</span>
      <input id="bk-deadband" type="number" step="0.5" min="0" value="0" />
    </label>
    <div id="bk-list" class="bk-list"></div>
    <p id="bk-count" class="bk-count"></p>
    <div class="editor-actions">
      <button id="bk-apply" class="btn primary" data-i18n="apply_to_n">Apply to N relays</button>
    </div>
    <p id="bk-msg" class="ed-msg"></p>
  </aside>

  <!-- Expanded chart modal -->
  <div id="chart-modal" class="chart-modal hidden">
    <div class="chart-modal-card">
      <div class="chart-modal-head">
        <span id="chart-modal-title"></span>
        <div class="ed-history-range" id="chart-modal-range">
          <button class="btn tiny range-btn active" data-range="24">24h</button>
          <button class="btn tiny range-btn" data-range="168">7d</button>
          <button class="btn tiny range-btn" data-range="720">30d</button>
        </div>
        <button id="chart-modal-csv" class="btn tiny" data-i18n-title="download_csv" title="Download CSV"><i class="bi bi-download"></i> CSV</button>
        <button id="chart-modal-close" class="x">&times;</button>
      </div>
      <div style="position:relative">
        <svg id="chart-modal-svg" viewBox="0 0 900 400" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="chart-tooltip" class="chart-tooltip hidden"></div>
      </div>
    </div>
  </div>

  <!-- Presets panel -->
  <aside id="preset-editor" class="editor hidden">
    <div class="editor-head">
      <h2><i class="bi bi-bookmark"></i> <span data-i18n="presets">Presets</span></h2>
      <button id="pr-close" class="x">&times;</button>
    </div>
    <div style="display:flex;gap:8px">
      <input id="pr-name" type="text" data-i18n-ph="preset_name_ph" placeholder="Preset name" style="flex:1" />
      <button id="pr-save" class="btn primary"><i class="bi bi-save"></i> Save</button>
    </div>
    <div id="pr-list" class="bk-list"></div>
    <p id="pr-msg" class="ed-msg"></p>
  </aside>

  <!-- Login (validates against your Home Assistant account) -->
  <div id="login-modal" class="login-modal hidden">
    <div class="login-card">
      <h2><i class="bi bi-shield-lock"></i> <span data-i18n="sign_in_to_edit">Sign in to edit</span></h2>
      <p class="login-sub"><span data-i18n="use_ha_1">Use your </span><b>Home Assistant</b><span data-i18n="use_ha_2"> account.</span></p>
      <input id="login-user" type="text" data-i18n-ph="username" placeholder="Username" autocomplete="username" />
      <input id="login-pass" type="password" data-i18n-ph="password" placeholder="Password" autocomplete="current-password" />
      <div class="login-actions">
        <button id="login-submit" class="btn primary" data-i18n="sign_in">Sign in</button>
        <button id="login-cancel" class="btn" data-i18n="cancel">Cancel</button>
      </div>
      <p id="login-msg" class="ed-msg"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
