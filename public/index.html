<!DOCTYPE html>
<html lang="en" class="text-[19px] mobile:text-[20px]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay Panel</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>try{var t=localStorage.getItem('relaypanel-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="m-0 bg-bg text-fg font-sans">
  <div id="ha-banner" class="hidden bg-[#b45309] text-white text-center font-bold py-2 px-3 text-[.95rem]"><i class="bi bi-exclamation-triangle-fill"></i> <span data-i18n="ha_unreachable">Home Assistant unreachable — readings may be stale</span></div>
  <header class="flex items-center justify-between gap-4 px-5 py-3 bg-surface border-b border-border shadow-[0_1px_3px_rgba(27,35,54,.05)] fixed top-0 left-0 right-0 z-[21] [.kiosk_&]:hidden mobile:gap-2 mobile:px-[14px]">
    <h1 class="m-0 text-[1.35rem] font-extrabold tracking-[.2px] whitespace-nowrap mobile:text-[1.25rem]"><svg class="inline-block w-[1em] h-[1em] align-[-.12em]" viewBox="0 0 32 32" style="width:1.35em;height:1.35em"><rect x="7" y="9" width="18" height="14" rx="2" fill="none" stroke="#eab308" stroke-width="2"/><circle cx="21" cy="16" r="4" fill="#eab308"/><line x1="3" y1="11" x2="7" y2="11" stroke="#eab308" stroke-width="1.5"/><line x1="3" y1="21" x2="7" y2="21" stroke="#eab308" stroke-width="1.5"/></svg> <span data-i18n="app_title" class="mobile:hidden">Relay Panel</span> <span id="summary" class="text-[.8rem] font-semibold text-muted ml-2.5 whitespace-nowrap"></span></h1>
    <button id="btn-menu" class="hidden mobile:inline-flex mobile:items-center mobile:justify-center mobile:min-w-[52px] mobile:min-h-[48px] mobile:text-[1.4rem] border border-border-strong bg-surface text-fg rounded-[11px] cursor-pointer active:translate-y-px" aria-label="Menu" aria-expanded="false"><i class="bi bi-list"></i></button>
    <div id="toolbar" class="toolbar flex items-center gap-2.5 flex-wrap mobile:hidden mobile:absolute mobile:top-full mobile:left-0 mobile:right-0 mobile:flex-col mobile:items-stretch mobile:gap-2.5 mobile:bg-surface mobile:border-b-2 mobile:border-border mobile:p-[14px] mobile:m-0 mobile:shadow-panel mobile:z-[15]">
      <span id="status" class="text-base text-ok font-bold min-w-0 transition-opacity duration-200 empty:opacity-0 mobile:w-full mobile:m-0 mobile:text-center"></span>
      <div class="flex items-center gap-2 mobile:w-full [.live-mode_&]:hidden tb-add relative">
        <button id="btn-add-menu" data-ui="btn btnTb"><i class="bi bi-plus-lg"></i> <span data-i18n="add">Add</span> <i class="bi bi-caret-down-fill"></i></button>
        <div id="add-menu" class="hidden flex flex-col gap-1.5 absolute top-full left-0 mt-2 min-w-[220px] bg-surface border-2 border-border rounded-xl p-2 shadow-panel z-20 mobile:static mobile:grid mobile:grid-cols-2 mobile:w-full mobile:bg-transparent mobile:border-0 mobile:shadow-none mobile:p-0 mobile:m-0 mobile:min-w-0 mobile:gap-2.5">
          <button id="btn-add-single" data-ui="btn btnMenu"><i class="bi bi-plus-lg"></i> <span data-i18n="add_single_relay">Add single relay</span></button>
          <select id="device-picker" data-ui="btn btnMenu mobile:min-h-[54px]"><option value="" data-i18n="physical_relay_ph">+ Physical relay…</option></select>
          <select id="area-picker" data-ui="btn btnMenu mobile:min-h-[54px]"><option value="" data-i18n="area_ph">+ Area…</option></select>
        </div>
      </div>
      <div class="flex items-center gap-2 mobile:grid mobile:grid-cols-2 mobile:gap-2.5">
        <button id="btn-mode" data-ui="btn btnTb"><i class="bi bi-pencil-square"></i> <span id="mode-label">Edit</span></button>
        <button id="btn-logout" data-ui="btn btnTb" class="hidden" data-i18n-title="sign_out" title="Sign out"><i class="bi bi-box-arrow-right"></i></button>
        <button id="btn-lang" data-ui="btn btnTb" title="Keel / Language">🇪🇪</button>
      </div>
      <span class="w-0.5 h-[30px] bg-border mobile:hidden"></span>
      <div class="flex items-center gap-1 mobile:hidden">
        <button id="btn-zoom-out" data-ui="btn" data-i18n-title="zoom_out" title="Zoom out"><i class="bi bi-zoom-out"></i></button>
        <button id="btn-zoom-in" data-ui="btn" data-i18n-title="zoom_in" title="Zoom in"><i class="bi bi-zoom-in"></i></button>
      </div>
      <div class="flex items-center gap-2 mobile:block mobile:w-full tb-advanced relative">
        <button id="btn-advanced" data-ui="btn" class="mobile:hidden" data-i18n-title="advanced" title="More"><i class="bi bi-gear"></i></button>
        <div id="advanced-menu" class="hidden flex flex-col gap-1.5 absolute top-full right-0 mt-2 min-w-[200px] bg-surface border-2 border-border rounded-xl p-2 shadow-panel z-20 mobile:static mobile:grid mobile:grid-cols-2 mobile:w-full mobile:bg-transparent mobile:border-0 mobile:shadow-none mobile:p-0 mobile:m-0 mobile:min-w-0 mobile:gap-2.5">
          <button id="btn-export" data-ui="btn btnMenu"><i class="bi bi-download"></i> <span data-i18n="export_layout">Export layout</span></button>
          <button id="btn-import" data-ui="btn btnMenu"><i class="bi bi-upload"></i> <span data-i18n="import_layout">Import layout</span></button>
          <span class="h-0.5 bg-border my-[3px] rounded-[2px] mobile:hidden"></span>
          <button id="btn-activity" data-ui="btn btnMenu"><i class="bi bi-clock-history"></i> <span data-i18n="activity_log">Activity log</span></button>
          <span class="h-0.5 bg-border my-[3px] rounded-[2px] mobile:hidden"></span>
          <button id="btn-bulk" data-ui="btn btnMenu"><i class="bi bi-collection"></i> <span data-i18n="bulk_edit">Bulk edit</span></button>
          <span class="h-0.5 bg-border my-[3px] rounded-[2px] mobile:hidden"></span>
          <button id="btn-presets" data-ui="btn btnMenu"><i class="bi bi-bookmark"></i> <span data-i18n="presets">Presets</span></button>
          <span class="h-0.5 bg-border my-[3px] rounded-[2px] mobile:hidden"></span>
          <button id="btn-theme" data-ui="btn btnMenu"><i class="bi bi-moon-stars"></i> <span data-i18n="toggle_dark">Toggle dark mode</span></button>
          <span class="h-0.5 bg-border my-[3px] rounded-[2px] mobile:hidden"></span>
          <button id="btn-alloff" data-ui="btn btnMenu"><i class="bi bi-power"></i> <span data-i18n="all_off">All off</span></button>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </div>
    </div>
  </header>

  <main id="canvas" class="canvas edit"></main>

  <!-- Editor panel -->
  <aside id="editor" role="dialog" aria-modal="true" class="editor hidden" data-ui="editorAside">
    <div class="flex items-center justify-between">
      <h2 data-ui="panelH2" data-i18n="edit_relay">Edit relay</h2>
      <button id="ed-close" data-ui="closeBtn" aria-label="Close">&times;</button>
    </div>
    <label data-ui="label"><span data-i18n="name">Name</span>
      <input id="ed-name" type="text" data-i18n-ph="name_ph" placeholder="e.g. Masterwood heater" maxlength="190" data-ui="field" class="placeholder:text-muted placeholder:opacity-80" />
    </label>
    <label data-ui="label"><span data-i18n="relay_to_switch">Relay to switch</span>
      <select id="ed-relay" data-ui="field"></select>
    </label>
    <button id="ed-rename-relay" data-ui="tiny" type="button"><i class="bi bi-pencil"></i> <span data-i18n="rename_this_relay">Rename this relay</span></button>
    <label data-ui="label"><span data-i18n="temp_sensor">Temperature sensor</span>
      <select id="ed-sensor" data-ui="field"></select>
    </label>
    <button id="ed-rename-sensor" data-ui="tiny" type="button"><i class="bi bi-pencil"></i> <span data-i18n="rename_this_sensor">Rename this sensor</span></button>
    <label data-ui="label"><span data-i18n="area">Area</span>
      <select id="ed-area" data-ui="field"><option value="" data-i18n="none_opt">— none —</option></select>
    </label>
    <label data-ui="label"><span data-i18n="heat_or_cool">Heat or cool?</span>
      <select id="ed-mode" data-ui="field">
        <option value="auto">Auto — heat as needed</option>
        <option value="below">Heating — switch ON when too cold</option>
      </select>
    </label>
    <label data-ui="label"><span data-i18n="target_temp">Target temperature (°C)</span>
      <input id="ed-temp" type="number" step="0.5" value="20" data-ui="field" />
    </label>
    <label data-ui="label"><span data-i18n="switchback_gap">Switch-back gap (°C) — optional, 0 = switch exactly at target</span>
      <input id="ed-deadband" type="number" step="0.5" min="0" value="0" data-ui="field" />
    </label>
    <div>
      <label data-ui="label"><span data-i18n="min_on">Minimum on-time (min)</span>
        <input id="ed-minon" type="number" step="1" min="0" value="0" data-ui="field" />
        <span class="text-[.75rem] text-muted leading-[1.2]" data-i18n="min_on_hint">Prevent short cycling: relay won't turn off before this time</span>
      </label>
      <label data-ui="label" class="mt-3"><span data-i18n="min_off">Minimum off-time (min)</span>
        <input id="ed-minoff" type="number" step="1" min="0" value="0" data-ui="field" />
        <span class="text-[.75rem] text-muted leading-[1.2]" data-i18n="min_off_hint">Prevent short cycling: relay won't turn on before this time</span>
      </label>
    </div>
    <div>
      <label class="flex flex-row items-center gap-2 font-semibold text-muted"><input id="ed-notify" type="checkbox" class="min-h-0 w-auto" /> <span data-i18n="notify_on_issues">Notify on issues</span></label>
      <label id="ed-notify-deviation-label" data-ui="label" class="hidden mt-1.5"><span data-i18n="notify_deviation">Alert if temp deviates by (°C)</span>
        <input id="ed-notify-deviation" type="number" step="0.5" min="1" value="5" data-ui="field" />
      </label>
    </div>
    <div class="border border-border rounded-[10px] p-2.5 bg-surface-2 flex flex-col gap-2">
      <label class="flex flex-row items-center gap-2 font-semibold text-muted"><input id="ed-sched-on" type="checkbox" class="min-h-0 w-auto" /> <span data-i18n="use_schedule">Use a schedule (different target by time)</span></label>
      <div id="ed-sched-body" class="hidden">
        <div id="ed-sched-blocks" class="flex flex-col gap-2"></div>
        <button id="ed-sched-add" data-ui="tiny" type="button"><i class="bi bi-plus-lg"></i> <span data-i18n="add_time_block">Add time block</span></button>
        <label data-ui="label"><span data-i18n="fallback_temp">Other times, target (°C)</span>
          <input id="ed-sched-fallback" type="number" step="0.5" data-ui="field" />
        </label>
        <div class="text-[.75rem] text-muted" data-i18n="sched_hint">The main target above is used when no block matches (if no fallback set).</div>
      </div>
    </div>
    <div id="ed-stale" class="hidden bg-[var(--stale-bg)] text-[var(--stale-fg)] border-[1.5px] border-[var(--stale-border)] rounded-lg px-2.5 py-2 text-[.85rem] font-semibold"></div>
    <div id="ed-history" class="hidden flex flex-col gap-1">
      <div class="flex items-center justify-between text-[.85rem] font-bold text-muted gap-1.5">
        <span data-i18n="last_24h">History</span>
        <div class="flex gap-1">
          <button data-ui="rangeBtn" class="range-btn bg-primary border-primary text-white" data-range="24">24h</button>
          <button data-ui="rangeBtn" class="range-btn" data-range="168">7d</button>
          <button data-ui="rangeBtn" class="range-btn" data-range="720">30d</button>
        </div>
        <button id="ed-csv" data-ui="tiny" data-i18n-title="download_csv" title="Download CSV"><i class="bi bi-download"></i> CSV</button>
      </div>
      <div class="relative">
        <svg id="ed-spark" class="w-full h-auto aspect-[2/1] bg-surface-2 border-[1.5px] border-border rounded-lg" viewBox="0 0 440 220" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="ed-tooltip" class="hidden absolute pointer-events-none bg-surface text-fg border-[1.5px] border-border-strong rounded-lg px-2.5 py-1.5 text-[.8rem] leading-[1.4] whitespace-nowrap shadow-[0_2px_8px_rgba(0,0,0,.12)] -translate-x-1/2 -translate-y-[110%]"></div>
      </div>
      <div id="ed-history-info" class="text-[.8rem] text-muted tabular-nums"></div>
    </div>
    <div class="flex flex-col gap-2.5 mt-2.5">
      <button id="ed-bind" data-ui="btnPrimary" class="mobile:min-h-[54px]" data-i18n="save_turn_on_auto">Save &amp; activate thermostat</button>
      <button id="ed-duplicate" data-ui="btn" class="mobile:min-h-[54px]" data-i18n="duplicate_relay">Duplicate</button>
      <button id="ed-unbind" data-ui="btn" class="mobile:min-h-[54px]" data-i18n="remove_automation">Remove automation</button>
      <button id="ed-delete" data-ui="btnDanger" class="mobile:min-h-[54px]" data-i18n="delete_this_relay">Delete this relay</button>
    </div>
    <div id="ed-automation" class="hidden flex flex-col gap-2 mt-2 p-3 border-2 border-border rounded-[10px] bg-surface-2">
      <div id="ed-automation-row" class="hidden flex flex-col gap-2">
        <span id="ed-automation-status"></span>
        <button id="ed-automation-toggle" data-ui="btn" type="button"></button>
      </div>
      <button id="ed-relay-toggle" data-ui="btn" type="button"></button>
    </div>
    <p id="ed-msg" class="text-[.95rem] min-h-[1.3em] font-semibold"></p>
  </aside>

  <!-- Device (physical relay) editor panel -->
  <aside id="dev-editor" role="dialog" aria-modal="true" class="editor hidden" data-ui="editorAside">
    <div class="flex items-center justify-between">
      <h2 data-ui="panelH2" data-i18n="physical_relay_h">Physical relay</h2>
      <button id="de-close" data-ui="closeBtn" aria-label="Close">&times;</button>
    </div>
    <label data-ui="label"><span data-i18n="label_shown">Label (shown on the box)</span>
      <input id="de-name" type="text" maxlength="190" data-ui="field" />
    </label>
    <button id="de-rename-ha" data-ui="tiny" type="button"><i class="bi bi-pencil"></i> <span data-i18n="rename_device_ha">Rename device in Home Assistant</span></button>
    <label data-ui="label"><span data-i18n="group_area">Group / area</span>
      <select id="de-area" data-ui="field"><option value="" data-i18n="none_opt">— none —</option></select>
    </label>
    <div class="text-[.95rem] font-bold text-muted mt-1.5" data-i18n="outputs">Outputs</div>
    <div id="de-outputs" class="flex flex-col gap-1.5"></div>
    <select id="de-add-output" class="border border-border-strong bg-surface text-fg px-4 py-[11px] rounded-[11px] cursor-pointer text-base font-semibold min-h-[48px] leading-[1.1]"><option value="" data-i18n="add_output_ph">+ Add output…</option></select>
    <div class="flex flex-col gap-2.5 mt-2.5">
      <button id="de-save" data-ui="btnPrimary" class="mobile:min-h-[54px]" data-i18n="save">Save</button>
      <button id="de-delete" data-ui="btnDanger" class="mobile:min-h-[54px]" data-i18n="remove_from_board">Remove from board</button>
    </div>
    <p id="de-msg" class="text-[.95rem] min-h-[1.3em] font-semibold"></p>
  </aside>

  <!-- Activity log panel -->
  <aside id="activity-editor" role="dialog" aria-modal="true" class="editor hidden" data-ui="editorAside">
    <div class="flex items-center justify-between">
      <h2 data-ui="panelH2"><i class="bi bi-clock-history"></i> <span data-i18n="activity_log">Activity log</span></h2>
      <button id="act-close" data-ui="closeBtn" aria-label="Close">&times;</button>
    </div>
    <div id="act-list" class="flex flex-col gap-1 flex-1 overflow-y-auto"></div>
    <div id="act-pager" class="flex items-center justify-center gap-2 mt-2">
      <button id="act-prev" class="hidden self-start min-h-[36px] px-3 py-[7px] text-[.82rem] font-semibold rounded-lg bg-surface-2 text-muted border-[1.5px] border-border inline-flex items-center gap-[5px] cursor-pointer active:translate-y-px"><i class="bi bi-chevron-left"></i> <span data-i18n="newer">Newer</span></button>
      <span id="act-page-info"></span>
      <button id="act-next" class="hidden self-start min-h-[36px] px-3 py-[7px] text-[.82rem] font-semibold rounded-lg bg-surface-2 text-muted border-[1.5px] border-border inline-flex items-center gap-[5px] cursor-pointer active:translate-y-px"><i class="bi bi-chevron-right"></i> <span data-i18n="older">Older</span></button>
      <button id="act-csv" class="self-start min-h-[36px] px-3 py-[7px] text-[.82rem] font-semibold rounded-lg bg-surface-2 text-muted border-[1.5px] border-border inline-flex items-center gap-[5px] cursor-pointer active:translate-y-px" data-i18n-title="download_csv" title="Download CSV"><i class="bi bi-download"></i></button>
    </div>
    <p id="act-msg" class="text-[.95rem] min-h-[1.3em] font-semibold"></p>
  </aside>

  <!-- Bulk edit panel -->
  <aside id="bulk-editor" role="dialog" aria-modal="true" class="editor hidden" data-ui="editorAside">
    <div class="flex items-center justify-between">
      <h2 data-ui="panelH2"><i class="bi bi-collection"></i> <span data-i18n="bulk_edit">Bulk edit</span></h2>
      <button id="bk-close" data-ui="closeBtn" aria-label="Close">&times;</button>
    </div>
    <label data-ui="label"><span data-i18n="area">Area</span>
      <select id="bk-area" data-ui="field"><option value="" data-i18n="all_relays">All relays</option></select>
    </label>
    <label data-ui="label"><span data-i18n="heat_or_cool">Heat or cool?</span>
      <select id="bk-mode" data-ui="field">
        <option value="auto">Auto</option>
        <option value="below">Heating</option>
      </select>
    </label>
    <label data-ui="label"><span data-i18n="target_temp">Target temperature (°C)</span>
      <input id="bk-temp" type="number" step="0.5" value="20" data-ui="field" />
    </label>
    <label data-ui="label"><span data-i18n="switchback_gap">Deadband (°C)</span>
      <input id="bk-deadband" type="number" step="0.5" min="0" value="0" data-ui="field" />
    </label>
    <div id="bk-list" class="flex flex-col gap-1"></div>
    <p id="bk-count" class="text-[.85rem] font-semibold text-muted mt-1"></p>
    <div class="flex flex-col gap-2.5 mt-2.5">
      <button id="bk-apply" data-ui="btnPrimary" class="mobile:min-h-[54px]" data-i18n="apply_to_n">Apply to N relays</button>
    </div>
    <p id="bk-msg" class="text-[.95rem] min-h-[1.3em] font-semibold"></p>
  </aside>

  <!-- Expanded chart modal -->
  <div id="chart-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-4">
    <div class="bg-surface rounded-[14px] p-5 w-[min(95vw,1000px)] shadow-panel flex flex-col gap-2.5">
      <div class="flex items-center gap-2 font-bold">
        <span id="chart-modal-title" class="flex-1"></span>
        <select id="chart-modal-range" class="min-h-0 px-2 py-[7px] text-[.78rem] font-semibold rounded-[7px] border-[1.5px] border-border bg-surface-2 text-muted cursor-pointer">
          <option value="24">24h</option>
          <option value="168">7d</option>
          <option value="720">30d</option>
        </select>
        <button id="chart-modal-map" class="hidden min-h-0 px-3 py-[7px] text-[.82rem] font-semibold rounded-lg bg-surface-2 text-muted border-[1.5px] border-border inline-flex items-center gap-[5px] cursor-pointer active:translate-y-px" data-i18n-title="show_on_map" title="Show on map"><i class="bi bi-map"></i> <span data-i18n="map_word">Map</span></button>
        <button id="chart-modal-csv" class="min-h-0 px-3 py-[7px] text-[.82rem] font-semibold rounded-lg bg-surface-2 text-muted border-[1.5px] border-border inline-flex items-center gap-[5px] cursor-pointer active:translate-y-px" data-i18n-title="download_csv" title="Download CSV"><i class="bi bi-download"></i></button>
        <button id="chart-modal-close" class="bg-transparent border-0 text-muted text-[1.4rem] cursor-pointer leading-none" aria-label="Close">&times;</button>
      </div>
      <div class="relative">
        <svg id="chart-modal-svg" viewBox="0 0 900 400" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="chart-tooltip" class="hidden absolute pointer-events-none bg-surface text-fg border-[1.5px] border-border-strong rounded-lg px-2.5 py-1.5 text-[.8rem] leading-[1.4] whitespace-nowrap shadow-[0_2px_8px_rgba(0,0,0,.12)] -translate-x-1/2 -translate-y-[110%]"></div>
      </div>
    </div>
  </div>

  <!-- Presets panel -->
  <aside id="preset-editor" role="dialog" aria-modal="true" class="editor hidden" data-ui="editorAside">
    <div class="flex items-center justify-between">
      <h2 data-ui="panelH2"><i class="bi bi-bookmark"></i> <span data-i18n="presets">Presets</span></h2>
      <button id="pr-close" data-ui="closeBtn" aria-label="Close">&times;</button>
    </div>
    <div class="flex gap-2">
      <input id="pr-name" type="text" data-i18n-ph="preset_name_ph" placeholder="Preset name" maxlength="190" data-ui="field" class="flex-1 placeholder:text-muted placeholder:opacity-80" />
      <button id="pr-save" class="border border-primary bg-primary text-white px-4 py-[11px] rounded-[11px] cursor-pointer text-base font-semibold min-h-[48px] leading-[1.1] active:translate-y-px"><i class="bi bi-save"></i> Save</button>
    </div>
    <div id="pr-list" class="flex flex-col gap-1"></div>
    <p id="pr-msg" class="text-[.95rem] min-h-[1.3em] font-semibold"></p>
  </aside>

  <!-- Editor backdrop overlay -->
  <div id="backdrop" class="hidden fixed inset-0 bg-black/25 z-[19]"></div>

  <!-- Login (validates against your Home Assistant account) -->
  <div id="login-modal" class="hidden fixed inset-0 z-[50] flex items-center justify-center bg-black/45 p-4">
    <div class="w-full max-w-[360px] flex flex-col gap-3 bg-surface text-fg border-2 border-solid border-border rounded-[14px] p-[22px] shadow-panel">
      <h2 data-ui="panelH2"><i class="bi bi-shield-lock"></i> <span data-i18n="sign_in_to_edit">Sign in to edit</span></h2>
      <p class="m-0 text-muted text-[.95rem]"><span data-i18n="use_ha_1">Use your </span><b>Home Assistant</b><span data-i18n="use_ha_2"> account.</span></p>
      <input id="login-user" type="text" data-i18n-ph="username" placeholder="Username" autocomplete="username"
        class="bg-input text-fg border-2 border-solid border-border rounded-[10px] p-3 text-[1.05rem] min-h-[50px] focus:outline-none focus:border-primary" />
      <input id="login-pass" type="password" data-i18n-ph="password" placeholder="Password" autocomplete="current-password"
        class="bg-input text-fg border-2 border-solid border-border rounded-[10px] p-3 text-[1.05rem] min-h-[50px] focus:outline-none focus:border-primary" />
      <div class="flex gap-2.5">
        <button id="login-submit" class="flex-1 border border-primary bg-primary text-white px-4 py-[11px] rounded-[11px] cursor-pointer text-base font-semibold min-h-[48px] leading-[1.1] active:translate-y-px" data-i18n="sign_in">Sign in</button>
        <button id="login-cancel" class="flex-1 border border-border-strong bg-surface text-fg px-4 py-[11px] rounded-[11px] cursor-pointer text-base font-semibold min-h-[48px] leading-[1.1] active:translate-y-px" data-i18n="cancel">Cancel</button>
      </div>
      <p id="login-msg" class="text-[.95rem] min-h-[1.3em] font-semibold"></p>
    </div>
  </div>

  <script src="js/ui-classes.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
